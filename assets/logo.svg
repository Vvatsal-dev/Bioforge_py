<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bf-flask-grad" x1="256" y1="65" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="25%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="bf-liquid-fill" x1="256" y1="90" x2="256" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.30" />
    </linearGradient>

    <linearGradient id="bf-sparkle-grad" x1="220" y1="190" x2="300" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="bf-leaf-grad" x1="272" y1="222" x2="300" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Flask Liquid Fill -->
  <path
    d="M 234 94 L 234 138 L 150 196 L 150 266 L 256 332 L 362 266 L 362 196 L 278 138 L 278 94 Z"
    fill="url(#bf-liquid-fill)"
    stroke-linejoin="round"
  />

  <!-- Hexagonal Flask Outline -->
  <path
    d="M 234 92 L 234 138 L 150 196 L 150 266 L 256 332 L 362 266 L 362 196 L 278 138 L 278 92"
    stroke="url(#bf-flask-grad)"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Flask Top Rim Cap -->
  <rect
    x="206"
    y="68"
    width="100"
    height="24"
    rx="12"
    fill="url(#bf-flask-grad)"
  />

  <!-- 4-Pointed Star Center -->
  <path
    d="M 256 216 Q 256 235 275 235 Q 256 235 256 254 Q 256 235 237 235 Q 256 235 256 216 Z"
    fill="url(#bf-sparkle-grad)"
  />

  <!-- Rays -->
  <line x1="256" y1="204" x2="256" y2="192" stroke="url(#bf-sparkle-grad)" stroke-width="5.5" stroke-linecap="round" />
  <line x1="256" y1="266" x2="256" y2="278" stroke="url(#bf-sparkle-grad)" stroke-width="5.5" stroke-linecap="round" />
  <line x1="226" y1="235" x2="214" y2="235" stroke="url(#bf-sparkle-grad)" stroke-width="5.5" stroke-linecap="round" />
  <line x1="286" y1="235" x2="298" y2="235" stroke="url(#bf-sparkle-grad)" stroke-width="5.5" stroke-linecap="round" />
  <line x1="235" y1="256" x2="226" y2="265" stroke="url(#bf-sparkle-grad)" stroke-width="5.5" stroke-linecap="round" />
  <line x1="277" y1="256" x2="286" y2="265" stroke="url(#bf-sparkle-grad)" stroke-width="5.5" stroke-linecap="round" />
  <line x1="235" y1="214" x2="226" y2="205" stroke="url(#bf-sparkle-grad)" stroke-width="5.5" stroke-linecap="round" />

  <!-- Top-Right Organic Leaf -->
  <path d="M 270 221 Q 275 216 280 211" stroke="url(#bf-sparkle-grad)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 277 215 C 278 205, 287 197, 301 191 C 300 206, 292 218, 277 215 Z" fill="url(#bf-leaf-grad)" />

  <!-- BioForge Typography Label -->
  <text
    x="256"
    y="435"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', Inter, -apple-system, system-ui, sans-serif"
    font-size="64"
    font-weight="700"
    letter-spacing="-1.5"
    fill="#00685f"
  >BioForge</text>
</svg>
